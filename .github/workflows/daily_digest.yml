name: CRE Daily Digest

on:
  # GitHub runs `schedule` in UTC only (no DST) and treats it as best-effort:
  # measured over 20 days, the first run of the day landed a MEDIAN of ~4h10
  # after its cron time (min 3h05, max 7h15), so digests were arriving
  # 9:30 AM - 1:30 PM ET instead of the 6:30 AM target.
  #
  # So the crons below are deliberately set ~4h BEFORE the desired send time,
  # to be absorbed by that queue delay. This does NOT make the digest stale:
  # the job fetches when it actually dequeues (~10:30 UTC), not at cron time.
  #
  # Two regimes are covered, and the skip-if-already-ran guard sends only the
  # first one through:
  #   - queue delayed (typical): the 06:22 attempt dequeues ~10:30 UTC.
  #   - queue empty (occasional): the early attempts are held back by the
  #     EARLIEST_SEND_UTC floor below, and the 10:22 attempt sends on time.
  schedule:
    - cron: '22 6 * * *'    # 2:22 AM ET — expects ~4h delay => ~6:30 AM ET
    - cron: '47 6 * * *'
    - cron: '23 7 * * *'
    - cron: '22 10 * * *'   # clears the floor; covers the no-delay case
    - cron: '8 12 * * *'    # final safety net
  workflow_dispatch:
    inputs:
      force:
        description: 'Send even if a digest already ran today'
        type: boolean
        default: false
      dry_run:
        description: 'Test run — build the digest and log the funnel but do NOT send'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if digest already ran today, or if it is too early to send
        id: check
        env:
          # Don't email before this UTC time: 6:00 AM EDT / 5:00 AM EST. The
          # early crons only exist to be absorbed by GitHub's queue delay; if
          # the queue happens to be empty they would otherwise fire at ~2 AM ET.
          # Later crons (10:22, 12:08 UTC) are past this floor, so a day where
          # every attempt runs promptly still gets a digest.
          EARLIEST_SEND_UTC: '10:00'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          NOW=$(date -u +%H:%M)
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "ran=false" >> $GITHUB_OUTPUT
            echo "Force run requested — proceeding regardless of today's history."
          elif grep -q "\"$TODAY\"" data/seen_urls.json 2>/dev/null; then
            echo "ran=true" >> $GITHUB_OUTPUT
            echo "Digest already ran today ($TODAY) — skipping."
          elif [ "${{ github.event_name }}" = "schedule" ] && [[ "$NOW" < "$EARLIEST_SEND_UTC" ]]; then
            echo "ran=true" >> $GITHUB_OUTPUT
            echo "Too early to send ($NOW UTC < $EARLIEST_SEND_UTC UTC) — the queue was fast today. A later attempt will send."
          else
            echo "ran=false" >> $GITHUB_OUTPUT
            echo "Digest has not run today ($TODAY) — proceeding."
          fi

      - name: Set up Python
        if: steps.check.outputs.ran == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.ran == 'false'
        run: pip install -r requirements.txt

      - name: Fetch articles and send digest
        if: steps.check.outputs.ran == 'false'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python -m aggregator.main

      - name: Upload dry-run preview
        # dry_run renders the email to data/preview.html, which is gitignored —
        # so without this the file was written to the runner and thrown away,
        # leaving no way to see the email being tuned.
        if: steps.check.outputs.ran == 'false' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: data/preview.html
          if-no-files-found: warn

      - name: Save seen URLs
        if: steps.check.outputs.ran == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_urls.json
          git diff --staged --quiet || git commit -m "chore: update seen URLs [skip ci]"
          git push
