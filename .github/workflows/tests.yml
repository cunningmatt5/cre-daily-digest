name: Tests

# Runs on every pull request so a regression is caught before it can reach the
# daily send. The suite is fully offline — no network, no API calls, no mail —
# so it needs no secrets and is safe to run on any branch.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
